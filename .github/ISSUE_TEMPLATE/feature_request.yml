name: 功能建议
description: 从实际使用场景说明需要解决的问题
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户场景与当前困难
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 期望的行为与验收方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案与兼容影响
