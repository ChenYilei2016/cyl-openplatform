spring.application.name=cyl-openplatform
spring.config.import=optional:file:${OPEN_PLATFORM_CONFIG:./config/local/private/application.properties}
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.discovery.register-enabled=false
server.address=${OPEN_PLATFORM_BIND_ADDRESS:127.0.0.1}
server.port=${OPEN_PLATFORM_PORT:18080}
server.forward-headers-strategy=none
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=CYL_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${OPEN_PLATFORM_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
spring.datasource.url=${OPEN_PLATFORM_DB_URL:jdbc:mysql://127.0.0.1:3306/cyl_openplatform}
spring.datasource.username=${OPEN_PLATFORM_DB_USERNAME:cyl}
spring.datasource.password=${OPEN_PLATFORM_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
spring.data.redis.host=${OPEN_PLATFORM_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${OPEN_PLATFORM_REDIS_PORT:6379}
spring.data.redis.username=${OPEN_PLATFORM_REDIS_USERNAME:}
spring.data.redis.password=${OPEN_PLATFORM_REDIS_PASSWORD:}
spring.data.redis.database=${OPEN_PLATFORM_REDIS_DATABASE:0}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
spring.data.redis.repositories.enabled=false
open-platform.name=CYL Open Platform
open-platform.admin-login-url=/admin/login.html
open-platform.identity.provider=local
open-platform.login.required-path-patterns=/admin-api/**,/portal-api/**
open-platform.login.admin-tenant-ids=
open-platform.publish.audit.enabled=${OPEN_PLATFORM_PUBLISH_AUDIT_ENABLED:true}
open-platform.token.ttl=${OPEN_PLATFORM_TOKEN_TTL:7d}
open-platform.environment-release.environment-id=${OPEN_PLATFORM_ENVIRONMENT_ID:local}
open-platform.environment-release.node-id=${OPEN_PLATFORM_NODE_ID:local}
open-platform.gateway.provider.key-id=${OPEN_PLATFORM_PROVIDER_KEY_ID:}
open-platform.gateway.provider.private-key=${OPEN_PLATFORM_PROVIDER_PRIVATE_KEY:}
open-platform.gateway.http.max-connections=128
open-platform.gateway.http.pending-acquire-max-count=64
open-platform.gateway.http.connect-timeout=2s
open-platform.gateway.http.acquire-timeout=1s
open-platform.gateway.http.max-concurrent-requests=128
open-platform.gateway.http.max-request-bytes=65536
open-platform.gateway.http.max-response-bytes=262144
open-platform.gateway.http.total-timeout=8s

open-platform.gateway.dubbo.max-payload-bytes=524288
open-platform.gateway.dubbo.max-concurrent-requests=128
open-platform.gateway.dubbo.connect-timeout=2s
open-platform.gateway.dubbo.total-timeout=8s
open-platform.gateway.dubbo.max-request-bytes=65536
open-platform.gateway.dubbo.max-response-bytes=262144

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never


open-platform.observability.response-log-enabled=true
open-platform.observability.response-log-max-bytes=2048
