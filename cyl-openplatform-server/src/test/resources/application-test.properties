spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.enabled=false
open-platform.environment-release.environment-id=local
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2-functions.sql,classpath:db/access-schema.sql,classpath:db/mcp-schema.sql,classpath:db/catalog-schema.sql,classpath:db/dubbo-connection-schema.sql,classpath:db/token-schema.sql,classpath:db/publication-schema.sql,classpath:db/governance-schema.sql,classpath:db/observability-schema.sql,classpath:db/operations-metrics-schema.sql,classpath:db/environment-release-transfer-schema.sql,classpath:db/environment-release-receipt-schema.sql,classpath:db/sdk-asset-schema.sql,classpath:db/operations-alert-schema.sql,classpath:db/signature-schema.sql,classpath:db/administrator-schema.sql

open-platform.observability.cleanup-enabled=false

# 普通H2/身份替身测试不启动Redis，真实Redis行为由跨进程IT单独验证。
management.health.redis.enabled=false

open-platform.operations.cleanup-enabled=false
open-platform.operations.alerts.evaluation-enabled=false

# 普通功能回归使用隔离测试租户；真实后台租户边界由 LoginBoundaryHttpTest 显式覆盖。
open-platform.login.admin-tenant-ids=
