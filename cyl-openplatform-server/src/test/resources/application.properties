# 同名测试资源会遮蔽 main application.properties；先导入生产默认值，再覆盖 H2 配置。
# 两个源路径分别支持 Maven 模块目录和 IDE 仓库根目录，不连接 Nacos。
spring.config.import=optional:file:src/main/resources/application.properties,optional:file:cyl-openplatform-server/src/main/resources/application.properties,classpath:application-test.properties,classpath:provider-test.properties
